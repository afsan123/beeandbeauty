      - paragraph [ref=f10e1400]: From long-wearing liquid lipsticks to sheer lip oils, this edit covers every finish for Indian skin tones and weather. You'll find transferproof mattes like Matte Attack, comfortable crayons, peptide-infused lipsticks and glosses, the creamy Mousse Muse, and tinted care from Drop A Tint Lip Oil. Suits both everyday wear and full-coverage looks.
      - paragraph [ref=f10e1401]: For a bold, no-touch-up finish through long days and meals, reach for transferproof mattes or the Mettle liquid range. If comfort matters in dry weather, the Glide Peptide serum lipstick and plumping gloss stick keep lips soft. Want something low-effort? Drop A Tint Lip Oil and Partner In Shine gloss give a natural, cushiony wash of colour.
