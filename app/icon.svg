      <stop offset="0%" stop-color="#6A1B6D" />
      <stop offset="100%" stop-color="#4A104C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E295" />
      <stop offset="100%" stop-color="#D4AF37" />
